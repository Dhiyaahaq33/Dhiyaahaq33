name: Update profile stats

on:
  schedule:
    - cron: '30 4 * * *'   # ~11:30 WIB daily (fallback safety net)
  workflow_dispatch:
  repository_dispatch:
    types: [stats-refresh]

concurrency:
  group: update-stats
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ secrets.STATS_TOKEN }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install chart dependencies
        run: pip install --quiet matplotlib numpy

      - name: Refresh Lines of Code + Contributions
        run: bash scripts/update-stats.sh

      - name: Commit and push if changed (with retry on race)
        run: |
          git config user.name "Dhiyaahaq33"
          git config user.email "139051782+Dhiyaahaq33@users.noreply.github.com"
          git add README.md loc-chart.png
          if git diff --cached --quiet; then
            echo "Nothing changed."
            exit 0
          fi
          git commit -m "chore: auto-refresh LOC and contributions"
          for i in 1 2 3 4 5; do
            if git push; then
              exit 0
            fi
            echo "Push rejected, retrying ($i/5)..."
            git pull --rebase origin "$(git branch --show-current)"
          done
          echo "Push failed after retries."
          exit 1
